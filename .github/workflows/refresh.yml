name: 数据健康巡检与告警
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 巡检平台真源生成器（生成成功 / 数据新鲜 / 镜像推送）
        run: node tools/check_platform.js
      # 数据健康巡检：价格/事件停更、校验未过、事件源全停 → 微信告警（配置了 webhook 才发）
      - name: 数据健康巡检与异常告警
        if: always()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node tools/notify_run.js check
